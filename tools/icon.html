<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>icon</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// App icon renderer: screenshot this page at 512x512 / 192x192 / 180x180.
import { drawHero } from '../js/hero.js';

const c = document.getElementById('c');
const n = Math.min(innerWidth, innerHeight);
c.width = c.height = n;
const ctx = c.getContext('2d');

const g = ctx.createRadialGradient(n * 0.5, n * 0.38, n * 0.05, n * 0.5, n * 0.5, n * 0.75);
g.addColorStop(0, '#5a4bc4');
g.addColorStop(0.55, '#242a6e');
g.addColorStop(1, '#10132e');
ctx.fillStyle = g;
ctx.fillRect(0, 0, n, n);

// sparkles
ctx.fillStyle = 'rgba(255,230,140,.85)';
for (const [x, y, r] of [[0.18, 0.2, 0.018], [0.82, 0.16, 0.024], [0.86, 0.62, 0.014], [0.12, 0.7, 0.012]]) {
  ctx.beginPath();
  ctx.arc(x * n, y * n, r * n, 0, Math.PI * 2);
  ctx.fill();
}

// ground glow
ctx.fillStyle = 'rgba(255,213,79,.18)';
ctx.beginPath();
ctx.ellipse(n * 0.5, n * 0.8, n * 0.34, n * 0.08, 0, 0, Math.PI * 2);
ctx.fill();

const s = n / 82;
ctx.setTransform(s, 0, 0, s, n * 0.5, n * 0.54);
const p = { x: 0, y: 0, face: { x: 0, y: 1 }, faceAngle: -1.15, moving: false, walkT: 0, inv: 0, swing: 0, swingAngle: 0, spin: 0, dash: null };
drawHero(ctx, p, { g: 2, lv: 40, up: 5 }, 0, { cat: 'sword', g: 3, lv: 30, up: 5 });
document.title = 'ready';
</script>
</body>
</html>
